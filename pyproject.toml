[project]
name = "rasp-scanner"
version = "0.1.0"
description = "Config-driven Security Test Runner for REST API business-logic testing (OWASP WSTG)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "jsonpath-ng>=1.15.0",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
    "jinja2>=3.1.4",
]

[project.scripts]
rasp-scanner = "rasp_scanner.entrypoints.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rasp_scanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "integration: tests that hit a live VAmPI instance (deselect with -m 'not integration')",
]
addopts = "-ra"
