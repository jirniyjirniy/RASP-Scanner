# ============================================================================
#  Конфигурация РАННЕРА (не сценария).
#  Описывает СТЕНД и МЕХАНИКУ ВХОДА — то, что общее для всех сценариев.
#  Передаётся через:  rasp-scanner run --config config.example.yaml
#  Значения ниже — дефолты под VAmPI; показаны явно для наглядности.
#  Запуск без --config = ровно эти дефолты.
# ============================================================================

# Базовый адрес стенда. Переопределяется флагом --target или env TARGET_URL.
target: http://localhost:5001

timeout: 15            # таймаут HTTP-запроса, сек
verify_tls: true       # проверять TLS-сертификат (false — для самоподписанных стендов)
follow_redirects: false  # идти по 30x (включи для session-логинов, отвечающих редиректом)
max_body_chars: 8000   # сколько символов тела ответа класть в отчёт

# ── АВТОРИЗАЦИЯ ──────────────────────────────────────────────────────────────
# type выбирает механику: login | static | basic | none
auth:
  type: login

  # --- type: login — ленивый логин роли, токен из ответа ---
  login:
    method: POST
    path: /users/v1/login
    body:                            # тело логина ЛЮБОГО типа
      type: json                     # json | form | raw | multipart
      fields:                        # поля для json/form/multipart; доступны
        username: ${username}        #   ${username} ${email} ${identity} ${password}
        password: ${password}
      # raw: "login=${identity}&pwd=${password}"   # для type: raw
      # content_type: text/plain                    # Content-Type для raw
    token:
      source: json                   # json | header | cookie | regex
      path: auth_token               # source=json: точечный путь или $.jsonpath
      # header: X-Subject-Token       # source=header: имя заголовка ответа
      # cookie: session               # source=cookie: имя cookie из Set-Cookie
      # regex: 'name="csrf" value="([^"]+)"'   # source=regex: группа 1 = токен
    session: false                   # нести cookies ответа логина на запросы роли

  # --- Куда подставлять учётку в запросы шага (список → можно несколько) ---
  inject:
    - into: header                   # header | cookie | query
      name: Authorization
      template: "Bearer ${token}"    # ${token} — значение из login.token

  # --- type: basic — HTTP Basic из учётки роли (логина нет) ---
  # type: basic
  # basic:
  #   header: Authorization          # куда класть "Basic base64(user:pass)"

  # --- type: static — без логина: готовые значения из env ---
  # type: static
  # static:
  #   inject:
  #     - { into: header, name: X-API-Key, template: ${env.API_KEY} }

  # --- CSRF pre-flow (опционально, для любого type) ---
  # csrf:
  #   enabled: true
  #   fetch: { method: GET, path: /login }       # откуда брать токен
  #   token: { source: cookie, cookie: XSRF-TOKEN }
  #   inject: { into: header, name: X-XSRF-TOKEN, template: ${token} }
