# ============================================================================
#  Конфигурация РАННЕРА (не сценария).
#  Описывает СТЕНД и механику входа — то, что общее для всех сценариев.
#  Передаётся через:  rasp-scanner run --config config.example.yaml
#  Значения ниже — дефолты под VAmPI; показаны явно для наглядности.
# ============================================================================

# Базовый адрес стенда. Переопределяется флагом --target или env TARGET_URL.
target: http://localhost:5001

timeout: 15          # таймаут HTTP-запроса, сек
verify_tls: true     # проверять TLS-сертификат (false — для самоподписанных стендов)
max_body_chars: 8000 # сколько символов тела ответа класть в отчёт

# Как раннер логинит роли и подставляет токен.
auth:
  login:
    method: POST
    path: /users/v1/login           # endpoint логина
    body:                            # шаблон тела; доступны ${username} ${email} ${identity} ${password}
      username: ${username}
      password: ${password}
    token_path: auth_token           # где в ответе лежит токен (точечный путь или $.jsonpath)
  inject:
    header: Authorization            # в какой заголовок класть токен
    template: "Bearer ${token}"      # ${token} — значение из token_path
