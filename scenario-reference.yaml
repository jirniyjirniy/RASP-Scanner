---
# ============================================================================
#  СПРАВОЧНИК ФОРМАТА СЦЕНАРИЯ
#  Это не рабочий тест, а описание всех возможностей структуры.
#  Один файл = один сценарий = один проверяемый вид уязвимости.
# ============================================================================


# ── МЕТАДАННЫЕ ──────────────────────────────────────────────────────────────
# Нужны отчёту, CLI-фильтрам и человеку, который откроет файл.

id: example-scenario          # обязателен. Стабильный ключ: --only example-scenario,
                              # ссылка в отчёте. Менять нельзя, в отличие от name.
name: Человекочитаемый заголовок   # обязателен. Короткое имя для отчёта и лога.
description: >                # что проверяем и чем это опасно. ">" склеивает
  Несколько строк текста,     # перенесённые строки в один абзац.
  которые станут одной строкой.
severity: high                # обязателен. Только из набора:
                              #   critical | high | medium | low | info
                              # (ограниченный список → опечатка упадёт при валидации)
wstg: WSTG-ATHZ-04            # ID классификации OWASP WSTG. Формат WSTG-XXXX-NN.
tags: [authz, idor]           # список меток для фильтрации запуска: --tags authz
remediation: >                # как исправить. Попадёт в отчёт рядом с находкой.
  Текст рекомендации.


# ── РОЛИ ────────────────────────────────────────────────────────────────────
# Логин ЛЕНИВЫЙ: роль логинится не заранее, а при первом её упоминании в "as:".
# Endpoint логина и путь к токену заданы в общем конфиге раннера, не здесь.

roles:
  user_a:                     # имя роли, на него ссылается "as: user_a" в шаге
    username: ${env.USER_A_NAME}   # учётки из env: секреты не лежат в git
    password: ${env.USER_A_PASS}
  user_b:                     # роль, учётка которой создаётся самим сценарием,
    username: ${attacker_name}     # берётся из vars (см. ниже)
    password: ${password}


# ── ПЕРЕМЕННЫЕ СЦЕНАРИЯ ──────────────────────────────────────────────────────
# Доступны во всех шагах как ${имя}. Живут только в пределах одного сценария.

vars:
  book: book-${run_id}        # строка с подстановкой → результат тоже строка
  secret: secret-${run_id}    # ${run_id} даёт раннер: уникален на каждое ВЫПОЛНЕНИЕ
                              # сценария (в т.ч. между сценариями одного прогона) —
                              # чтобы имена создаваемых ресурсов не сталкивались
  admin: true                 # bool сохраняет тип: при подстановке в тело уйдёт
                              # true, а не строка "true" (см. правило Renderer ниже)

# Встроенные переменные, которые даёт раннер (их не надо объявлять):
#   ${run_id}   — уникальный идентификатор выполнения сценария
#   ${env.ИМЯ}  — значение переменной окружения (пароли, TARGET_URL из CI)


# ── ШАГИ ────────────────────────────────────────────────────────────────────
# Выполняются по порядку, контекст переменных общий.
# Порядок внутри шага: render → send → save → expect.

steps:

  # --- Шаг целиком: все возможные поля ---
  - name: Описание шага           # подпись в логе и отчёте

    # type — что означает результат проверки ЭТОГО шага для вердикта.
    # НЕ про то, "атакующее ли действие", а про точку расхождения:
    # attack ставят на шаг, где защищённый и уязвимый API ответили бы ПО-РАЗНОМУ.
    #   setup  — провал expect = ERROR (подготовка/доказательство не удались, стоп)
    #   attack — провал expect = VULNERABLE, успех = SECURE
    type: setup                   # setup | attack

    as: user_a                    # необязательно. От чьего имени: раннер подставит
                                  # токен роли. Нет "as:" → запрос анонимный
                                  # (регистрация, логин, публичные ручки).

    # --- Запрос ---
    request:
      method: POST                # HTTP-метод: GET | POST | PUT | PATCH | DELETE
      path: /books/v1             # ТОЛЬКО путь. Адрес стенда приходит из --target,
                                  # поэтому один сценарий гоняется против любого стенда.
      headers:                    # необязательно. Для json Content-Type выставится сам.
        Authorization: "Bearer ${stolen_token}"
      params:                     # необязательно. Query-параметры (?a=1&b=2).
        q: test
      json:                       # тело запроса YAML-словарём (не строкой!).
        book_title: ${book}       # подстановка переменной
        secret: ${secret}
        admin: ${admin}           # уйдёт как bool true, т.к. значение = одна переменная

    # --- Сохранение значений из ответа (Extractors) ---
    # Выполняется ДО expect, чтобы проверки могли опираться на сохранённое.
    # Если поле не найдено на setup-шаге → ERROR (а не тихий None).
    save:
      # КОРОТКАЯ ФОРМА (строка) — путь по точкам внутри JSON ответа.
      token: auth_token           # префикс $. можно опустить, раннер добавит сам
      who: data.username          # вложенное поле: ответ {"data": {"username": ...}}

      # ДЛИННАЯ ФОРМА (словарь) — поиск нужного элемента в СПИСКЕ.
      victim:
        from: users               # список в ответе, по которому ищем
        where: {username: name1}  # условие: все пары должны совпасть
        get: password             # какое поле взять. Без "get" — сохранится весь объект.
        # all отсутствует → ожидаем РОВНО одно совпадение.
        #   0 совпадений   → ERROR
        #   1 совпадение   → значение
        #   2+ совпадений  → ERROR ("уточни условие или добавь all: true")

      # Список через all: тип результата задаёт автор, а не данные.
      admins:
        from: users
        where: {admin: true}      # группа → совпадений может быть сколько угодно
        all: true                 # ВСЕГДА список: 0 → [], 1 → [x], 2+ → [x, y, ...]
        # get не указан → элементы это целые объекты {username, password, ...},
        # чтобы работал индексный доступ ${admins.0.username}

    # --- Проверки (Assertions) ---
    # expect описывает ОЖИДАЕМЫЙ (для attack — БЕЗОПАСНЫЙ) результат.
    expect:
      status: 200                 # один код...
      # status: [401, 403, 404]   # ...или список допустимых кодов

      json:                       # проверка полей ответа по jsonpath: путь: ожидание
        $.data.admin: false       # равенство значению
        $.data.username: ${who}   # можно сравнивать с переменной

      body_contains: "success"    # в теле (как в строке) есть подстрока
      body_not_contains: ${secret}   # в теле НЕТ подстроки (чужого секрета не видно)

      vars:                       # проверки над переменными из контекста/save
        admins:                   # операторы:
          not_contains: ${attacker_name}   #   нет элемента/подстроки
          length: 1               #   точная длина списка
          # contains: x           #   есть элемент/подстрока
          # eq: y                 #   равно

    # --- Досрочный безопасный выход ---
    # Проверяется ДО expect. Совпало → сценарий завершается с вердиктом SECURE
    # (сервер сам отбил атаку). Тот же синтаксис проверок, что в expect.
    secure_if:
      status: [400, 422]          # напр. API отверг лишнее поле → защита сработала


# ============================================================================
#  ПРАВИЛА ДВИЖКА (не синтаксис YAML, но часть контракта формата)
# ============================================================================
#
#  RENDERER (подстановка ${...}):
#    • ${var}            — переменная из vars/save
#    • ${var.field}      — вложенное поле объекта
#    • ${var.0.field}    — элемент списка по индексу + его поле
#    • ${env.NAME}       — переменная окружения
#    • ${run_id}         — идентификатор прогона
#    • Сохранение типа: если значение целиком = одна переменная ("${admin}"),
#      подставляется исходный тип (bool/int/list). Если переменная внутри текста
#      ("book-${run_id}") — подставляется строкой.
#    • Неизвестная переменная ${опечатка} → понятная ошибка, а не пустая строка.
#
#  ВЕРДИКТ СЦЕНАРИЯ (свёртка по всем шагам):
#    • есть хоть один ERROR      → ERROR
#    • иначе есть хоть VULNERABLE → VULNERABLE
#    • иначе                     → SECURE
#
#  ЗАВЕРШЕНИЕ:
#    • ERROR          → стоп сразу
#    • secure_if      → стоп, вердикт SECURE
#    • attack-вердикт → продолжаем до конца (чтобы собрать шаги-доказательства)
#
#  СОЗНАТЕЛЬНО НЕ ПОДДЕРЖИВАЕМ (пока):
#    • for_each — перебор списка с запросом на каждый элемент. Движок линейный;
#      для доказательства уязвимости хватает одного элемента (${admins.0}).
# ============================================================================