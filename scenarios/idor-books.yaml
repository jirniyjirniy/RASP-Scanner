---
# ── Метаданные: для отчёта, CLI-фильтров и человека ──
id: idor-books                       # стабильный ключ сценария: --only idor-books, ссылка в отчёте
name: IDOR — чтение чужой книги      # короткий заголовок для человека
description: >                       # что проверяем и чем это опасно (">" склеивает строки в одну)
  Пользователь B запрашивает книгу пользователя A по её названию.
  Если API отдаёт чужой secret, права доступа к объектам не проверяются.
severity: high                       # критичность: critical | high | medium | low | info
wstg: WSTG-ATHZ-04                   # ID из OWASP WSTG (Insecure Direct Object References)
tags: [authz, idor]                  # для фильтрации запуска: --tags authz
remediation: >                       # как исправить, попадёт в отчёт рядом с finding
  Проверять, что владелец книги совпадает с текущим пользователем.

# ── Роли: кто участвует в сценарии ──
roles:                               # Auth Manager логинит каждую роль до первого шага
  user_a:                            # имя роли, на него ссылается поле "as" в шагах
    username: ${env.USER_A_NAME}     # логин из переменной окружения
    password: ${env.USER_A_PASS}     # пароль тоже из env: секреты не попадают в git
  user_b:                            # вторая роль, "атакующий"
    username: ${env.USER_B_NAME}
    password: ${env.USER_B_PASS}

# ── Переменные сценария ──
vars:                                # значения, доступные во всех шагах как ${имя}
  book: book-${run_id}               # уникальное название на каждый прогон (run_id генерирует раннер)
  secret: secret-${run_id}           # уникальный секрет: именно его ищем в чужом ответе

# ── Шаги ──
steps:                               # выполняются по порядку, контекст переменных общий
  - name: A создаёт книгу            # подпись шага в логе и отчёте
    type: setup                      # подготовка: провал = ERROR (тест не смог начаться), а не уязвимость
    as: user_a                       # от чьего имени: раннер подставит токен user_a
    request:                         # описание HTTP-запроса
      method: POST                   # HTTP-метод
      path: /books/v1                # только путь, адрес стенда приходит из --target
      json:                          # тело YAML-словарём, httpx сам сделает JSON и Content-Type
        book_title: ${book}          # подстановка переменной из vars
        secret: ${secret}
    expect:                          # ожидаемый результат шага
      status: 200                    # книга должна создаться, иначе дальше проверять нечего

  - name: A читает свою книгу        # позитивный контроль
    type: setup                      # доказываем, что книга существует и доступна владельцу
    as: user_a
    request:
      method: GET
      path: /books/v1/${book}        # переменная подставляется и в путь
    expect:
      status: 200
      json:                          # проверка конкретных полей ответа через jsonpath
        $.secret: ${secret}          # владелец видит свой секрет, значит данные на месте

  - name: B читает книгу A
    type: attack                     # атака: провал проверки = VULNERABLE
    as: user_b                       # та же операция от чужой роли, в этом суть IDOR
    request:
      method: GET
      path: /books/v1/${book}
    expect:                          # описывает БЕЗОПАСНОЕ поведение
      status: [401, 403, 404]        # любой из этих кодов означает отказ в доступе
      body_not_contains: ${secret}   # главный признак: чужого секрета в ответе нет