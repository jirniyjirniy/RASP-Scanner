---
# ── Метаданные ──
id: juiceshop-login-sqli
name: SQL-инъекция в логине — вход без пароля
description: >
  Форма входа подставляет email прямо в SQL-запрос. Полезная нагрузка
  ' OR true-- закрывает условие и комментирует проверку пароля, поэтому сервер
  авторизует ПЕРВОГО пользователя (администратора) без знания пароля. Это обход
  аутентификации через инъекцию.
severity: critical
wstg: WSTG-INPV-05                   # Testing for SQL Injection
tags: [injection, sqli, auth-bypass]
remediation: >
  Использовать параметризованные запросы/ORM-биндинги вместо конкатенации;
  не строить SQL из пользовательского ввода.

# ── Шаги ──
# Анонимный запрос: роль не нужна (as: отсутствует) — мы и проверяем вход без учётки.
steps:
  - name: Логин с SQLi-нагрузкой вместо email
    type: attack                     # провал безопасного ожидания = VULNERABLE
    request:
      method: POST
      path: /rest/user/login
      json:
        email: "' OR true--"         # инъекция: истинное условие + комментарий
        password: anything           # пароль не важен — его проверка закомментирована
    expect:                          # БЕЗОПАСНО: такие данные не должны пускать
      status: [401, 403]             # корректный сервер отвергает вход
      body_not_contains: authentication   # выдали блок authentication с токеном → вход удался
